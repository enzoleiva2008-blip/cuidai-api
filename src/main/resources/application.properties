spring.application.name=cuidai-api

# Porta: o Render informa a porta pela variavel PORT; localmente usa 8080
server.port=${PORT:8080}

# Banco Oracle FIAP - os valores vem de VARIAVEIS DE AMBIENTE.
# Nunca coloque usuario ou senha aqui (a disciplina desconta pontos).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Pool pequeno: o Oracle da FIAP limita conexoes por usuario
spring.datasource.hikari.maximum-pool-size=3

# Nunca mandar stack trace ou mensagem interna para o cliente
server.error.include-stacktrace=never
server.error.include-message=never

# Datas no JSON no formato ISO (2026-11-12T08:00:00)
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Sao_Paulo
